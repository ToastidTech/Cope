name: Build, Push, and Deploy Cope

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: cope
  EXPRESS_SERVICE_ARN: arn:aws:ecs:us-west-2:299113402161:service/default/cope-7c1f
  TASK_DEFINITION_FAMILY: default-cope-7c1f

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.COPE_AWS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Prepare Express Mode task definition
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          CURRENT_TASK_DEF_ARN="$(aws ecs list-task-definitions \
            --region "$AWS_REGION" \
            --family-prefix "$TASK_DEFINITION_FAMILY" \
            --sort DESC \
            --max-items 1 \
            --query 'taskDefinitionArns[0]' \
            --output text)"

          if [ -z "$CURRENT_TASK_DEF_ARN" ] || [ "$CURRENT_TASK_DEF_ARN" = "None" ]; then
            echo "Could not find task definition family: $TASK_DEFINITION_FAMILY"
            exit 1
          fi

          echo "Current Express task definition: $CURRENT_TASK_DEF_ARN"

          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$CURRENT_TASK_DEF_ARN" \
            --query 'taskDefinition' > task-definition.json

          jq --arg IMAGE "$IMAGE_URI" --arg FAMILY "$TASK_DEFINITION_FAMILY" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .family = $FAMILY
            | .containerDefinitions[0].image = $IMAGE
          ' task-definition.json > new-task-definition.json

      - name: Register updated task definition
        id: task-def
        run: |
          set -euo pipefail

          NEW_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered task definition: $NEW_TASK_DEF_ARN"

      - name: Deploy Cope to ECS Express Mode
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$EXPRESS_SERVICE_ARN" \
            --task-definition-arn "$TASK_DEF_ARN" \
            --monitor-resources

          echo "Cope Express Mode deployment started."
